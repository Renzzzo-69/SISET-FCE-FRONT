<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISET-FCE - Decanatura</title>
    <!-- Tailwind (CDN) + Fonts used by the provided Decanatura design -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'sidebar-bg': 'rgb(var(--sidebar-bg) / <alpha-value>)',
              primary: 'rgb(var(--primary) / <alpha-value>)',
              secondary: 'rgb(var(--secondary) / <alpha-value>)',
              background: 'rgb(var(--background) / <alpha-value>)',
              'surface-container-lowest': 'rgb(var(--surface-lowest) / <alpha-value>)',
              'surface-variant': 'rgb(var(--surface-variant) / <alpha-value>)',
              'status-error': 'rgb(var(--status-error) / <alpha-value>)',
              'status-success': 'rgb(var(--status-success) / <alpha-value>)',
              'primary-container': 'rgb(var(--primary-container) / <alpha-value>)',
              'primary-fixed-dim': 'rgb(var(--primary-fixed-dim) / <alpha-value>)',
              'on-surface-variant': 'rgb(var(--on-surface-variant) / <alpha-value>)',
              'on-surface': 'rgb(var(--on-surface) / <alpha-value>)',
              outline: 'rgb(var(--outline) / <alpha-value>)',
              'outline-variant': 'rgb(var(--outline-variant) / <alpha-value>)',
              surface: 'rgb(var(--surface) / <alpha-value>)',
              'surface-container': 'rgb(var(--surface-container) / <alpha-value>)',
              'surface-container-low': 'rgb(var(--surface-container-low) / <alpha-value>)',
              'surface-container-high': 'rgb(var(--surface-container-high) / <alpha-value>)',
              'on-primary': '#ffffff',
              'on-primary-container': 'rgb(var(--on-primary-container) / <alpha-value>)',
              'on-primary-fixed': 'rgb(var(--on-primary-fixed) / <alpha-value>)',
              'on-primary-fixed-variant': 'rgb(var(--on-primary-fixed-variant) / <alpha-value>)',
              'primary-fixed': 'rgb(var(--primary-fixed) / <alpha-value>)',
              'secondary-container': 'rgb(var(--secondary-container) / <alpha-value>)',
              'on-secondary-container': 'rgb(var(--on-secondary-container) / <alpha-value>)',
              'error-container': 'rgb(var(--error-container) / <alpha-value>)',
              'on-error-container': 'rgb(var(--on-error-container) / <alpha-value>)',
              'on-tertiary-container': '#d69d61',
            },
            borderRadius: { lg: '0.25rem', xl: '0.5rem', full: '0.75rem' },
            spacing: {
              'sidebar-width': '250px',
              'header-height': '70px',
              'card-padding': '1.5rem',
              gutter: '1.25rem',
              'container-max-width': '896px',
            },
            fontFamily: {
              'body-lg': ['Inter'],
              'nav-caps': ['Inter'],
              'headline-md': ['Hanken Grotesk'],
              'headline-lg': ['Hanken Grotesk'],
              'label-md': ['Inter'],
              'headline-sm': ['Hanken Grotesk'],
              'label-sm': ['Inter'],
              'body-md': ['Inter'],
            },
            fontSize: {
              'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'nav-caps': [
                '10px',
                { lineHeight: '12px', letterSpacing: '0.1em', fontWeight: '700' },
              ],
              'headline-md': ['22px', { lineHeight: '30px', fontWeight: '600' }],
              'headline-lg': ['28px', { lineHeight: '36px', fontWeight: '700' }],
              'label-md': ['12px', { lineHeight: '16px', fontWeight: '500' }],
              'headline-sm': ['16px', { lineHeight: '24px', fontWeight: '600' }],
              'label-sm': ['11px', { lineHeight: '14px', fontWeight: '500' }],
              'body-md': ['14px', { lineHeight: '20px', fontWeight: '400' }],
            },
          },
        },
      }
    </script>
    <style>
      :root {
        --sidebar-bg: 40 58 112;
        --primary: 15 35 89;
        --secondary: 0 107 92;
        --background: 249 249 255;
        --surface: 249 249 255;
        --surface-lowest: 255 255 255;
        --surface-variant: 226 226 232;
        --surface-container: 237 237 243;
        --surface-container-low: 243 243 249;
        --surface-container-high: 231 232 238;
        --primary-container: 40 58 112;
        --on-surface: 25 28 32;
        --on-surface-variant: 69 70 79;
        --outline: 117 118 129;
        --outline-variant: 197 198 209;
        --primary-fixed: 219 225 255;
        --primary-fixed-dim: 181 196 255;
        --on-primary-container: 148 166 227;
        --on-primary-fixed: 0 23 77;
        --on-primary-fixed-variant: 50 68 123;
        --secondary-container: 156 239 220;
        --on-secondary-container: 11 111 96;
        --error-container: 255 218 214;
        --on-error-container: 147 0 10;
        --status-error: 186 26 26;
        --status-success: 0 107 92;
      }
      :root.dark {
        --sidebar-bg: 8 20 46;
        --primary: 155 181 255;
        --secondary: 77 224 193;
        --background: 7 12 23;
        --surface: 10 17 30;
        --surface-lowest: 16 25 43;
        --surface-variant: 43 55 76;
        --surface-container: 22 32 51;
        --surface-container-low: 13 22 38;
        --surface-container-high: 30 42 64;
        --primary-container: 40 66 137;
        --on-surface: 237 242 255;
        --on-surface-variant: 181 194 218;
        --outline: 127 145 175;
        --outline-variant: 55 72 101;
        --primary-fixed: 39 57 98;
        --primary-fixed-dim: 79 103 167;
        --on-primary-container: 196 209 255;
        --on-primary-fixed: 224 231 255;
        --on-primary-fixed-variant: 185 202 255;
        --secondary-container: 19 75 67;
        --on-secondary-container: 145 244 221;
        --error-container: 89 31 39;
        --on-error-container: 255 185 185;
        --status-error: 255 134 134;
        --status-success: 78 224 193;
      }
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }
      body {
        background-color: rgb(var(--background));
        color: rgb(var(--on-surface));
        transition:
          background-color 0.3s,
          color 0.3s;
      }
      .dark body {
        background-color: rgb(var(--background));
        background-image:
          radial-gradient(
            circle at 82% -8%,
            rgb(var(--primary-container) / 0.28),
            transparent 35rem
          ),
          radial-gradient(circle at 8% 92%, rgb(var(--secondary) / 0.1), transparent 32rem);
        background-attachment: fixed;
      }
      .dark input,
      .dark select,
      .dark textarea,
      .dark .bg-white {
        background-color: rgb(var(--surface-lowest)) !important;
        color: rgb(var(--on-surface)) !important;
      }
      .dark input::placeholder,
      .dark textarea::placeholder {
        color: rgb(var(--outline));
      }
      .dark input,
      .dark select,
      .dark textarea {
        border-color: rgb(var(--outline-variant) / 0.9) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.025);
      }
      .dark input:focus,
      .dark select:focus,
      .dark textarea:focus {
        border-color: rgb(var(--primary) / 0.8) !important;
        box-shadow:
          0 0 0 3px rgb(var(--primary) / 0.13),
          0 0 24px rgb(var(--primary) / 0.08) !important;
      }
      .dark .bg-background {
        background-color: transparent;
      }
      .dark .bg-surface-container-lowest {
        background-image: linear-gradient(145deg, rgb(255 255 255 / 0.025), transparent 45%);
        border-color: rgb(var(--outline-variant) / 0.7);
        box-shadow:
          0 14px 38px rgb(0 0 0 / 0.22),
          inset 0 1px 0 rgb(255 255 255 / 0.035);
      }
      .dark header.bg-surface,
      .dark header.bg-surface-container-lowest {
        background-color: rgb(var(--surface) / 0.84) !important;
        backdrop-filter: blur(18px) saturate(135%);
        -webkit-backdrop-filter: blur(18px) saturate(135%);
        box-shadow:
          0 1px 0 rgb(var(--primary) / 0.08),
          0 10px 30px rgb(0 0 0 / 0.16);
      }
      .dark aside.bg-sidebar-bg,
      .dark aside.bg-primary {
        background-image: linear-gradient(
          165deg,
          rgb(var(--primary-container) / 0.72),
          rgb(var(--sidebar-bg)) 38%,
          rgb(5 15 35)
        );
        box-shadow:
          10px 0 40px rgb(0 0 0 / 0.28),
          inset -1px 0 rgb(var(--primary) / 0.1);
      }
      .dark table tbody tr {
        transition:
          background-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .dark table tbody tr:hover {
        background-color: rgb(var(--primary) / 0.055) !important;
      }
      .dark .shadow-sm {
        box-shadow:
          0 10px 30px rgb(0 0 0 / 0.18),
          inset 0 1px 0 rgb(255 255 255 / 0.025);
      }
      .dark .shadow-md {
        box-shadow:
          0 16px 42px rgb(0 0 0 / 0.28),
          0 0 0 1px rgb(var(--primary) / 0.06);
      }
      .dark .bg-primary,
      .dark .bg-primary-container {
        box-shadow: 0 8px 22px rgb(var(--primary) / 0.14);
      }
      .dark button,
      .dark a {
        transition-duration: 0.2s;
      }
      .dark ::selection {
        color: rgb(var(--on-surface));
        background: rgb(var(--primary) / 0.32);
      }
      .dark ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      .dark ::-webkit-scrollbar-track {
        background: rgb(var(--surface-container-low));
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgb(var(--outline-variant));
        border: 2px solid rgb(var(--surface-container-low));
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
